<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
    <p><a href="/create">+ Новый пост</a></p>
    <h1>Посты</h1>
    {{if .Posts}}
        <ul>
            {{range .Posts}}
                <li>
                    <strong>{{.Title}}</strong>
                    {{.Content}}<br>
                    <small>{{.CreatedAt.Format "02.01.2006 15:04"}}</small><br>
                    <a class="btn btn-primary" href="/edit?id={{.ID}}">Редактировать</a>
                    <form action="/delete?id={{.ID}}" method="post">
                        <button class="btn btn-danger" onclick="return confirm('Удалить пост?')">Удалить</button>
                    </form>
                </li>
            {{end}}
        </ul>
    {{else}}
        <p>Пока нет ни одного поста. <a href="/create">Создать пост</a></p>
    {{end}}
</body>
</html>
