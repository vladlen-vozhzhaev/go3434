<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Bootstrap demo</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    </head>
    <body>
        <div class="container py-5">
            <h1 class="text-center">Добавить пост</h1>
            <div class="col-6 mx-auto">
                <form onsubmit="sendForm(); return false" action="/create" method="post">
                    <div class="mb-3">
                        <input id="title" class="form-control" name="title" type="text" placeholder="Заголовок" required>
                    </div>
                    <div class="mb-3">
                        <textarea id="content" class="form-control" name="content" id="" cols="30" rows="10" placeholder="Контент" required></textarea>
                    </div>
                    <div class="mb-3">
                        <input class="btn btn-primary" type="submit" value="Опубликовать">
                    </div>
                </form>
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
        <script>
            function sendForm(){
                const title = document.getElementById('title').value.trim();
                const content = document.getElementById('content').value.trim();
                fetch('/api/posts', {
                    method: "POST",
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({title: title, content: content})
                }).then(response => {
                    if (response.status === 401){
                        window.location.href = '/login'
                        return
                    }
                    window.location.href = '/';
                })

            }
        </script>
    </body>
</html>
